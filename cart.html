<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart</title>

  <!-- Стилі -->
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-straight/css/uicons-regular-straight.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="phone">

    <!-- Верхня частина -->
    <header class="header">
      <button class="back" onclick="window.location.href='shop.html'">
        <i class="fi fi-rr-angle-small-left"></i>
      </button>
      <h2>Shopping Cart</h2>
      <div class="cart">
        <i class="fi fi-rs-shopping-cart"></i>
        <span class="cart-count" id="cartCount">5</span>
      </div>
    </header>

    <!-- Основна частина -->
<main class="items">

  <div class="item" data-price="849.90">
    <img src="https://m.media-amazon.com/images/I/61zPdK3k2rL._AC_SX679_.jpg" alt="Video Camera" />
    <div class="info">
      <h3>Video Camera</h3>
      <p>Code #247890</p>
      <span class="price">$ 849.90</span>
    </div>
    <div class="controls">
      <button class="minus">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
      <span class="qty">1</span>
      <button class="plus">
        <svg xmlns="http://www.w3.org/2000/svg" width="" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M480 672V352a32 32 0 1 1 64 0v320a32 32 0 0 1-64 0"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="item" data-price="249.90">
    <img src="https://wafuu.com/cdn/shop/products/sony-walkman-s-series-4gb-mp3-player-with-bluetooth-nw-s313-black-229654_1080x.jpg?v=1706145115" alt="Walkman" />
    <div class="info">
      <h3>Walkman</h3>
      <p>Code #367381</p>
      <span class="price">$ 249.90</span>
    </div>
    <div class="controls">
      <button class="minus">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
      <span class="qty">1</span>
      <button class="plus">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M480 672V352a32 32 0 1 1 64 0v320a32 32 0 0 1-64 0"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="item" data-price="1449.90">
    <img src="https://vinylsound.ca/cdn/shop/products/VINYLSOUND-TECHNICS_SL1210G_GRAND_CLASS_REFERENCE_DIRECT_DRIVE_TURNTABLE_1600x.jpg?v=1656337135" alt="Turntable" />
    <div class="info">
      <h3>Turntable</h3>
      <p>Code #589001</p>
      <span class="price">$ 1449.90</span>
    </div>
    <div class="controls">
      <button class="minus">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
      <span class="qty">1</span>
      <button class="plus">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M480 672V352a32 32 0 1 1 64 0v320a32 32 0 0 1-64 0"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="item" data-price="99.90">
    <img src="https://ktr.com.au/wp-content/uploads/2014/08/7950-black-1000x1000.jpg" alt="Pager" />
    <div class="info">
      <h3>Pager</h3>
      <p>Code #567190</p>
      <span class="price">$ 99.90</span>
    </div>
    <div class="controls">
      <button class="minus">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
      <span class="qty">1</span>
      <button class="plus">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
          <path fill="currentColor" d="M352 480h320a32 32 0 1 1 0 64H352a32 32 0 0 1 0-64"/>
          <path fill="currentColor" d="M480 672V352a32 32 0 1 1 64 0v320a32 32 0 0 1-64 0"/>
          <path fill="currentColor" d="M512 896a384 384 0 1 0 0-768a384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896a448 448 0 0 1 0 896"/>
        </svg>
      </button>
    </div>
  </div>

</main>


    <!-- Нижня частина -->
    <div class="cart-footer">
      <div class="voucher-total">
        <input type="text" class="voucher" id="voucherInput" placeholder="VOUCHER CODE">
        <div class="total">TOTAL: $2649.60</div>
      </div>

      <button class="checkout">Checkout</button>
      <button class="paypal">
        Checkout with 
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal" height="20">
      </button>
    </div>
  </div>

  <script>
    const PROMO_CODE = "annchenso";
    const PROMO_RATE = 0.20;
    let promoApplied = false;

    function computeCartTotal() {
      let total = 0;
      document.querySelectorAll(".item").forEach(item => {
        const price = parseFloat(item.getAttribute("data-price")) || 0;
        const qty = parseInt(item.querySelector(".qty").textContent, 10) || 0;
        total += price * qty;
      });
      return total;
    }

    function renderTotal() {
      const baseTotal = computeCartTotal();
      const finalTotal = promoApplied ? baseTotal * (1 - PROMO_RATE) : baseTotal;

      document.querySelector("#totalValue").textContent = `$${finalTotal.toFixed(2)}`;

      let count = 0;
      document.querySelectorAll(".qty").forEach(q => count += parseInt(q.textContent, 10));
      document.getElementById("cartCount").textContent = count;
    }

    function attachQuantityHandlers() {
      document.querySelectorAll(".item").forEach(item => {
        const plus = item.querySelector(".plus");
        const minus = item.querySelector(".minus");
        const qty = item.querySelector(".qty");

        plus.addEventListener("click", () => {
          qty.textContent = parseInt(qty.textContent) + 1;
          renderTotal();
        });

        minus.addEventListener("click", () => {
          const value = parseInt(qty.textContent);
          if (value > 1) qty.textContent = value - 1;
          renderTotal();
        });
      });
    }

    function attachVoucherHandler() {
      const input = document.getElementById("voucherInput");
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const entered = input.value.trim().toLowerCase();
          if (entered === PROMO_CODE.toLowerCase()) {
            promoApplied = true;
            alert(`🎉 Промокод "${PROMO_CODE}" застосовано! -20%`);
          } else {
            promoApplied = false;
            alert("❌ Невірний промокод");
          }
          input.value = "";
          renderTotal();
        }
      });
    }

    function attachCheckoutHandlers() {
      document.querySelector(".checkout").addEventListener("click", () => {
        alert("✅ Замовлення успішно оформлено!");
      });

      document.querySelector(".paypal").addEventListener("click", () => {
        window.open("https://www.paypal.com/checkout", "_blank");
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      attachQuantityHandlers();
      attachVoucherHandler();
      attachCheckoutHandlers();
      renderTotal();
    });
  </script>
</body>
</html>
