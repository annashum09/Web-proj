    <!-- FOOTER -->
    <div class="cart-footer bg-[#211033] rounded-t-2xl p-4 max-[360px]:p-3 flex flex-col z-10">

      <div class="voucher-total flex items-center justify-between w-full gap-4 max-[360px]:flex-col max-[360px]:gap-[10px]">

        <input type="text"
               id="voucherInput"
               class="voucher flex-1 h-12 text-sm
                      border-2 border-[#ffffff] rounded-lg
                      bg-transparent text-[#f4f4f4] text-center font-medium px-3
                      placeholder:text-[#f4f4f4] placeholder:opacity-70
                      max-[360px]:w-full max-[360px]:text-[14px] max-[360px]:h-[48px]"
               placeholder="VOUCHER CODE">

        <div class="total flex-1 bg-[#ff4200] text-[#ffffff] font-bold
                    h-12 rounded-lg 
                    flex items-center justify-center gap-0.5 text-sm
                    max-[360px]:w-full max-[360px]:text-[15px] max-[360px]:h-[48px]">
          TOTAL: <span id="totalValue" class="font-extrabold">$0.00</span>
        </div>

      </div>

      <a href="checkout_tail.html" class="checkout checkout-btn
        bg-[#00e676] text-[#ffffff] font-bold text-base rounded-xl
        py-3.5 h-16 mt-2.5 mb-2.5 flex items-center justify-center
        hover:bg-[#ffffff] hover:text-[#00e676]">
        Checkout
      </a>

      <button class="paypal group bg-[#ffffff] text-[#283D81] font-bold text-base border border-[#211033]
                     h-16 rounded-xl cursor-pointer flex items-center justify-center gap-2
                     transition hover:bg-[#009cde] hover:text-[#ffffff]">
        Checkout with 
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg"
             class="h-5 transition group-hover:invert group-hover:brightness-0">
      </button>


    </div>

  <script>
    const PROMO_CODE = "annchenso";
    const PROMO_RATE = 0.20;
    let promoApplied = false;

    function computeCartTotal() {
      let total = 0;
      document.querySelectorAll(".item").forEach(item => {
        const price = parseFloat(item.getAttribute("data-price")) || 0;
        const qty = parseInt(item.querySelector(".qty").textContent, 10) || 0;
        total += price * qty;
      });
      return total;
    }

    function renderTotal() {
      const baseTotal = computeCartTotal();
      const finalTotal = promoApplied ? baseTotal * (1 - PROMO_RATE) : baseTotal;

      document.querySelector("#totalValue").textContent = `$${finalTotal.toFixed(2)}`;

      let count = 0;
      document.querySelectorAll(".qty").forEach(q => count += parseInt(q.textContent, 10));
      document.getElementById("cartCount").textContent = count;
    }

    function attachQuantityHandlers() {
      document.querySelectorAll(".item").forEach(item => {
        const plus = item.querySelector(".plus");
        const minus = item.querySelector(".minus");
        const qty = item.querySelector(".qty");

        plus.addEventListener("click", () => {
          qty.textContent = parseInt(qty.textContent) + 1;
          renderTotal();
        });

        minus.addEventListener("click", () => {
          const value = parseInt(qty.textContent);
          if (value > 1) qty.textContent = value - 1;
          renderTotal();
        });
      });
    }

    function attachVoucherHandler() {
      const input = document.getElementById("voucherInput");
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const entered = input.value.trim().toLowerCase();
          if (entered === PROMO_CODE.toLowerCase()) {
            promoApplied = true;
            alert(`🎉 Промокод "${PROMO_CODE}" застосовано! -20%`);
          } else {
            promoApplied = false;
            alert("❌ Невірний промокод");
          }
          input.value = "";
          renderTotal();
        }
      });
    }

      document.querySelector(".paypal").addEventListener("click", () => {
        window.open("https://www.paypal.com/checkout", "_blank");
      });
    

    document.addEventListener("DOMContentLoaded", () => {
      attachQuantityHandlers();
      attachVoucherHandler();
      attachCheckoutHandlers();
      renderTotal();
    });
    
  </script>
