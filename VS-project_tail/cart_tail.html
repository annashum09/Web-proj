<head>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-straight/css/uicons-regular-straight.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Montserrat', sans-serif; }

    .cart-count {
      position: absolute;
      line-height: 1px;
      top: 50%;
      left: 100%;
      transform: translate(-24%, -49%);
      box-shadow: 0 0 0 2px #fff;
    }

    .controls svg {
      transition: transform 0.1s;
    }
    .controls svg:hover {
      transform: scale(1.2);
    }

    .voucher::placeholder {
      color: #f4f4f4;
      opacity: 0.7;
    }

    .phone {
      min-width: 350px;
    }
    @media (max-width: 360px) {

  .voucher-total {
    flex-direction: column;
    gap: 10px !important;
  }

  .voucher-total input,
  .voucher-total .total {
    width: 100% !important;
  }

  .voucher {
    font-size: 14px !important;
    height: 48px !important;
  }

  .total {
    font-size: 15px !important;
    height: 48px !important;
  }

  .cart-footer {
    padding: 12px !important;
  }
}
  </style>
</head>

        Shopping Cart

    <!-- FOOTER -->

      <div class="voucher-total flex items-center justify-between w-full gap-[clamp(8px,2vw,20px)]">

        <input type="text"
               id="voucherInput"
               class="voucher flex-1 h-[clamp(44px,4vw,60px)] text-[clamp(12px,1.2vw,16px)]
                      border-[2.5px] border-white rounded-[clamp(8px,1vw,10px)]
                      bg-transparent text-[#f4f4f4] text-center font-medium px-[10px]"
               placeholder="VOUCHER CODE">

        <div class="total flex-1 bg-[#ff4200] text-white font-bold
                    h-[clamp(44px,4vw,60px)] rounded-[clamp(8px,1vw,10px)] 
                    flex items-center justify-center gap-[2px] text-[clamp(12px,1.2vw,16px)]">
          TOTAL: <span id="totalValue" class="font-extrabold">$0.00</span>
        </div>

      </div>

     <a href="checkout_tail.html" class="checkout-btn
    bg-[#00e676] text-white font-bold text-[16px] rounded-[12px]
    py-[14px] h-[66px] mt-[10px] mb-[10px] flex items-center justify-center
    hover:bg-white hover:text-[#00e676]">
  Checkout
</a>

      <button class="paypal group bg-white text-[#283D81] font-bold text-[16px] border border-[#211033]
                     h-[70px] rounded-[12px] cursor-pointer flex items-center justify-center gap-[8px]
                     transition hover:bg-[#009cde] hover:text-white">
  Checkout with 
  <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg"
       class="h-[21px] transition group-hover:invert group-hover:brightness-0">
</button>

  <script>
    const PROMO_CODE = "annchenso";
    const PROMO_RATE = 0.20;
    let promoApplied = false;

    function computeCartTotal() {
      let total = 0;
      document.querySelectorAll(".item").forEach(item => {
        // read price from data-price attribute (must exist)
        const price = parseFloat(item.getAttribute("data-price")) || 0;
        const qty = parseInt(item.querySelector(".qty").textContent, 10) || 0;
        total += price * qty;
      });
      return total;
    }

    function renderTotal() {
      const baseTotal = computeCartTotal();
      const finalTotal = promoApplied ? baseTotal * (1 - PROMO_RATE) : baseTotal;

      document.querySelector("#totalValue").textContent = `$${finalTotal.toFixed(2)}`;

      let count = 0;
      document.querySelectorAll(".qty").forEach(q => count += parseInt(q.textContent, 10));
      document.getElementById("cartCount").textContent = count;
    }

    function attachQuantityHandlers() {
      document.querySelectorAll(".item").forEach(item => {
        const plus = item.querySelector(".plus");
        const minus = item.querySelector(".minus");
        const qty = item.querySelector(".qty");

        plus.addEventListener("click", () => {
          qty.textContent = parseInt(qty.textContent) + 1;
          renderTotal();
        });

        minus.addEventListener("click", () => {
          const value = parseInt(qty.textContent);
          if (value > 1) qty.textContent = value - 1;
          renderTotal();
        });
      });
    }

    function attachVoucherHandler() {
      const input = document.getElementById("voucherInput");
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const entered = input.value.trim().toLowerCase();
          if (entered === PROMO_CODE.toLowerCase()) {
            promoApplied = true;
            alert(`🎉 Промокод "${PROMO_CODE}" застосовано! -20%`);
          } else {
            promoApplied = false;
            alert("❌ Невірний промокод");
          }
          input.value = "";
          renderTotal();
        }
      });
    }

    function attachCheckoutHandlers() {
      document.querySelector(".checkout").addEventListener("click", () => {
        alert("✅ Замовлення успішно оформлено!");
      });

      document.querySelector(".paypal").addEventListener("click", () => {
        window.open("https://www.paypal.com/checkout", "_blank");
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      attachQuantityHandlers();
      attachVoucherHandler();
      attachCheckoutHandlers();
      renderTotal();
    });
    
  </script>

</html>
